<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>randomchat admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #f4f1ff; --bg2: #ffeef4; --card: #fff; --ink: #231f3a; --muted: #7a7596;
      --brand: #6c4cf1; --brand-2: #ff5c8a; --line: #e3dcff; --err: #d6336c; --ok: #12a66a;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg1: #15122b; --bg2: #26122a; --card: #1f1b3a; --ink: #f1eeff; --muted: #a49fc4; --line: #3a3366; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px; color: var(--ink);
      font-family: 'Inter', 'Vazirmatn', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2)) fixed;
    }
    html[lang="fa"] body { font-family: 'Vazirmatn', 'Inter', system-ui, sans-serif; }
    .wrap { max-width: 640px; margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .logo { font-weight: 700; font-size: 22px; }
    .logo span { color: var(--brand); }
    .tools { display: flex; gap: 8px; }
    .pill {
      border: 1px solid var(--line); background: var(--card); color: var(--ink);
      border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer;
    }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px; margin-bottom: 16px; box-shadow: 0 10px 40px rgba(108,76,241,.12); }
    h2 { margin: 0 0 14px; font-size: 18px; }
    input[type=password] {
      width: 100%; padding: 12px 14px; font: inherit; color: var(--ink); background: transparent;
      border: 1.5px solid var(--line); border-radius: 12px; outline: none; margin-bottom: 12px; direction: ltr;
    }
    input:focus { border-color: var(--brand); }
    button.go {
      width: 100%; padding: 14px; border: 0; border-radius: 12px; cursor: pointer;
      font: inherit; font-weight: 600; font-size: 16px; color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
    }
    button.go:disabled { opacity: .6; cursor: wait; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
    .stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; }
    .stat b { display: block; font-size: 24px; }
    .stat span { font-size: 12px; color: var(--muted); }
    .result { margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.7; }
    .result.ok { background: rgba(18,166,106,.12); color: var(--ok); }
    .result.err { background: rgba(214,51,108,.12); color: var(--err); }
    .result .em { direction: ltr; unicode-bidi: embed; display: inline-block; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: start; }
    td.em { direction: ltr; unicode-bidi: embed; }
    th { color: var(--muted); font-weight: 500; }
    .setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0 18px; }
    .setting small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .switch { position: relative; width: 48px; height: 28px; flex: none; }
    .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
    .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: background .15s; }
    .switch span::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; background: #fff; border-radius: 50%; transition: transform .15s; }
    .switch input:checked + span { background: var(--brand); }
    .switch input:checked + span::after { transform: translateX(20px); }
    html[dir="rtl"] .switch input:checked + span::after { transform: translateX(-20px); }
    .switch input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }
    .hidden { display: none !important; }
    .empty { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">random<span>chat</span> <small data-i18n="admin" style="font-size:14px;color:var(--muted)"></small></div>
    <div class="tools">
      <button class="pill hidden" id="logout" data-i18n="logout" type="button"></button>
      <button class="pill" id="langBtn" type="button">فارسی</button>
    </div>
  </div>

  <div class="card" id="loginCard">
    <h2 data-i18n="login"></h2>
    <input type="password" id="pw" autocomplete="current-password" data-i18n-ph="password">
    <button class="go" id="loginBtn" type="button" data-i18n="enter"></button>
    <div class="result err hidden" id="loginErr"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <div class="stats">
        <div class="stat"><b id="sTotal">0</b><span data-i18n="users"></span></div>
        <div class="stat"><b id="sF">0</b><span data-i18n="females"></span></div>
        <div class="stat"><b id="sM">0</b><span data-i18n="males"></span></div>
        <div class="stat"><b id="sMatches">0</b><span data-i18n="matches"></span></div>
      </div>
      <div class="setting">
        <div>
          <b id="cityToggleLbl" data-i18n="cityToggle"></b>
          <small data-i18n="cityHint"></small>
        </div>
        <label class="switch"><input type="checkbox" id="cityEnabled" aria-labelledby="cityToggleLbl"><span></span></label>
      </div>
      <button class="go" id="matchBtn" type="button" data-i18n="send"></button>
      <div class="result hidden" id="result"></div>
    </div>

    <div class="card">
      <h2 data-i18n="recent"></h2>
      <div id="recent"></div>
    </div>
  </div>
</div>

<script>
const I18N = {
  en: {
    admin: 'admin', logout: 'Log out', login: 'Admin login', password: 'Password', enter: 'Enter',
    users: 'Users', females: 'Women', males: 'Men', matches: 'Intros sent',
    send: 'Send a random introduction', sending: 'Sending…', recent: 'Recent introductions',
    cityToggle: 'City field', cityHint: 'Show the city question on the signup form and prefer people from the same city.',
    e_settings_unavailable: 'Could not save the setting. Did you run migration.sql on the database?',
    none: 'No introductions yet.', sentTo: 'Introduction sent to:', age: 'age',
    e_unauthorized: 'Wrong password.',
    e_no_pair_available: 'No eligible pair left (need users of opposite gender who have not been introduced yet).',
    e_email_not_configured: 'Email is not configured (RESEND_API_KEY / FROM_EMAIL).',
    e_email_failed: 'The email provider rejected the request.',
    e_generic: 'Something went wrong.', langBtn: 'فارسی'
  },
  fa: {
    admin: 'مدیریت', logout: 'خروج', login: 'ورود مدیر', password: 'رمز عبور', enter: 'ورود',
    users: 'کاربران', females: 'زن', males: 'مرد', matches: 'آشنایی‌های ارسال‌شده',
    send: 'ارسال یک آشنایی تصادفی', sending: 'در حال ارسال…', recent: 'آشنایی‌های اخیر',
    cityToggle: 'فیلد شهر', cityHint: 'سؤال شهر در فرم ثبت‌نام نمایش داده شود و همشهری‌ها در انتخاب اولویت داشته باشند.',
    e_settings_unavailable: 'ذخیره‌ی تنظیم ممکن نشد. آیا فایل migration.sql را روی دیتابیس اجرا کرده‌ای؟',
    none: 'هنوز آشنایی‌ای ارسال نشده.', sentTo: 'ایمیل آشنایی ارسال شد به:', age: 'سن',
    e_unauthorized: 'رمز عبور اشتباه است.',
    e_no_pair_available: 'جفت مناسبی باقی نمانده (به کاربران غیرهمجنسی نیاز است که قبلاً با هم آشنا نشده‌اند).',
    e_email_not_configured: 'ارسال ایمیل تنظیم نشده است (RESEND_API_KEY / FROM_EMAIL).',
    e_email_failed: 'سرویس ایمیل درخواست را رد کرد.',
    e_generic: 'مشکلی پیش آمد.', langBtn: 'English'
  }
};
let lang = 'en';
try { lang = localStorage.getItem('rc_lang') || 'en'; } catch (e) {}
const $ = (id) => document.getElementById(id);
const t = (k) => I18N[lang][k];

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $('langBtn').textContent = t('langBtn');
  try { localStorage.setItem('rc_lang', lang); } catch (e) {}
  if (token) loadStats();
}
$('langBtn').addEventListener('click', () => { lang = lang === 'en' ? 'fa' : 'en'; applyLang(); });

let token = '';
try { token = sessionStorage.getItem('rc_admin') || ''; } catch (e) {}

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' } });
  const data = await res.json().catch(() => ({}));
  return { res, data };
}
const errText = (code) => t('e_' + code) || t('e_generic');

function showPanel(on) {
  $('loginCard').classList.toggle('hidden', on);
  $('panel').classList.toggle('hidden', !on);
  $('logout').classList.toggle('hidden', !on);
}

async function loadStats() {
  const { res, data } = await api('/api/admin/stats');
  if (res.status === 401) { logout(); return false; }
  if (!data.ok) return false;
  $('sTotal').textContent = data.counts.total;
  $('sF').textContent = data.counts.females;
  $('sM').textContent = data.counts.males;
  $('sMatches').textContent = data.counts.matches;
  $('cityEnabled').checked = data.city_enabled !== false;

  const box = $('recent');
  box.textContent = '';
  if (!data.recent.length) {
    const p = document.createElement('div'); p.className = 'empty'; p.textContent = t('none'); box.appendChild(p);
    return true;
  }
  const table = document.createElement('table');
  for (const r of data.recent) {
    const tr = document.createElement('tr');
    const who = (e, a, c) => e + ' (' + a + (c ? ', ' + c : '') + ')';
    for (const txt of [who(r.email_a, r.age_a, r.city_a), who(r.email_b, r.age_b, r.city_b), r.created_at]) {
      const td = document.createElement('td'); td.textContent = txt; td.className = 'em'; tr.appendChild(td);
    }
    table.appendChild(tr);
  }
  box.appendChild(table);
  return true;
}

function logout() {
  token = '';
  try { sessionStorage.removeItem('rc_admin'); } catch (e) {}
  showPanel(false);
}
$('logout').addEventListener('click', logout);

$('loginBtn').addEventListener('click', async () => {
  token = $('pw').value;
  $('loginErr').classList.add('hidden');
  const { res } = await api('/api/admin/stats');
  if (res.ok) {
    try { sessionStorage.setItem('rc_admin', token); } catch (e) {}
    showPanel(true);
    loadStats();
  } else {
    token = '';
    $('loginErr').textContent = errText('unauthorized');
    $('loginErr').classList.remove('hidden');
  }
});
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

$('cityEnabled').addEventListener('change', async (e) => {
  const box = e.target, want = box.checked, out = $('result');
  box.disabled = true;
  try {
    const { data } = await api('/api/admin/settings', { method: 'POST', body: JSON.stringify({ city_enabled: want }) });
    if (!data.ok) {
      box.checked = !want;
      out.className = 'result err';
      out.textContent = errText(data.error || 'generic');
    }
  } catch (err) {
    box.checked = !want;
  } finally {
    box.disabled = false;
  }
});

$('matchBtn').addEventListener('click', async () => {
  const btn = $('matchBtn'), out = $('result');
  btn.disabled = true; btn.textContent = t('sending'); out.className = 'result hidden';
  try {
    const { data } = await api('/api/admin/match', { method: 'POST' });
    out.classList.remove('hidden');
    if (data.ok) {
      out.className = 'result ok';
      out.textContent = t('sentTo') + ' ';
      data.pair.forEach((u, i) => {
        if (i) out.appendChild(document.createTextNode(' ↔ '));
        const s = document.createElement('span'); s.className = 'em';
        s.textContent = u.email + ' (' + t('age') + ' ' + u.age + (u.city ? ', ' + u.city : '') + ')';
        out.appendChild(s);
      });
      loadStats();
    } else {
      out.className = 'result err';
      out.textContent = errText(data.error || 'generic');
    }
  } catch (e) {
    out.className = 'result err'; out.textContent = t('e_generic');
  } finally {
    btn.disabled = false; btn.textContent = t('send');
  }
});

applyLang();
if (token) { loadStats().then(ok => { if (ok) showPanel(true); }); }
</script>
</body>
</html>
