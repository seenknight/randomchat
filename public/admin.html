<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>anymany admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #f4f1ff; --bg2: #ffeef4; --card: #fff; --ink: #231f3a; --muted: #7a7596;
      --brand: #6c4cf1; --brand-2: #ff5c8a; --line: #e3dcff; --err: #d6336c; --ok: #12a66a;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg1: #15122b; --bg2: #26122a; --card: #1f1b3a; --ink: #f1eeff; --muted: #a49fc4; --line: #3a3366; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px; color: var(--ink);
      font-family: 'Inter', 'Vazirmatn', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2)) fixed;
    }
    html[lang="fa"] body { font-family: 'Vazirmatn', 'Inter', system-ui, sans-serif; }
    .wrap { max-width: 640px; margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .logo { font-weight: 700; font-size: 22px; }
    .logo span { color: var(--brand); }
    .tools { display: flex; gap: 8px; }
    .pill {
      border: 1px solid var(--line); background: var(--card); color: var(--ink);
      border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer;
    }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px; margin-bottom: 16px; box-shadow: 0 10px 40px rgba(108,76,241,.12); }
    h2 { margin: 0 0 14px; font-size: 18px; }
    input[type=password] {
      width: 100%; padding: 12px 14px; font: inherit; color: var(--ink); background: transparent;
      border: 1.5px solid var(--line); border-radius: 12px; outline: none; margin-bottom: 12px; direction: ltr;
    }
    input:focus { border-color: var(--brand); }
    button.go {
      width: 100%; padding: 14px; border: 0; border-radius: 12px; cursor: pointer;
      font: inherit; font-weight: 600; font-size: 16px; color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
    }
    button.go:disabled { opacity: .6; cursor: wait; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
    .stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; }
    .stat b { display: block; font-size: 24px; }
    .stat span { font-size: 12px; color: var(--muted); }
    .result { margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.7; }
    .result.ok { background: rgba(18,166,106,.12); color: var(--ok); }
    .result.err { background: rgba(214,51,108,.12); color: var(--err); }
    .result .em { direction: ltr; unicode-bidi: embed; display: inline-block; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: start; }
    td.em { direction: ltr; unicode-bidi: embed; }
    th { color: var(--muted); font-weight: 500; }
    .setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0 18px; }
    .setting small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .switch { position: relative; width: 48px; height: 28px; flex: none; }
    .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
    .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: background .15s; }
    .switch span::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; background: #fff; border-radius: 50%; transition: transform .15s; }
    .switch input:checked + span { background: var(--brand); }
    .switch input:checked + span::after { transform: translateX(20px); }
    html[dir="rtl"] .switch input:checked + span::after { transform: translateX(-20px); }
    .switch input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }
    .pair { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 14px; }
    .pair h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 500; }
    .pair .who { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .pair .who .em { direction: ltr; unicode-bidi: embed; font-weight: 600; }
    .pair .meta { color: var(--muted); font-size: 13px; margin-top: 10px; }
    .pair .btns { display: flex; gap: 10px; margin-top: 14px; }
    .pair .btns button { flex: 1; padding: 12px; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer; }
    .pair .btns button:disabled { opacity: .6; cursor: wait; }
    .btn-send { border: 0; color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand-2)); }
    .btn-again { border: 1.5px solid var(--line); background: transparent; color: var(--ink); }
    .hidden { display: none !important; }
    .empty { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">any<span>many</span> <small data-i18n="admin" style="font-size:14px;color:var(--muted)"></small></div>
    <div class="tools">
      <button class="pill hidden" id="logout" data-i18n="logout" type="button"></button>
      <button class="pill" id="langBtn" type="button">فارسی</button>
    </div>
  </div>

  <div class="card" id="loginCard">
    <h2 data-i18n="login"></h2>
    <input type="password" id="pw" autocomplete="current-password" data-i18n-ph="password">
    <button class="go" id="loginBtn" type="button" data-i18n="enter"></button>
    <div class="result err hidden" id="loginErr"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <div class="stats">
        <div class="stat"><b id="sTotal">0</b><span data-i18n="users"></span></div>
        <div class="stat"><b id="sF">0</b><span data-i18n="females"></span></div>
        <div class="stat"><b id="sM">0</b><span data-i18n="males"></span></div>
        <div class="stat"><b id="sMatches">0</b><span data-i18n="matches"></span></div>
      </div>
      <div class="setting">
        <div>
          <b id="cityToggleLbl" data-i18n="cityToggle"></b>
          <small data-i18n="cityHint"></small>
        </div>
        <label class="switch"><input type="checkbox" id="cityEnabled" aria-labelledby="cityToggleLbl"><span></span></label>
      </div>
      <div class="setting">
        <div>
          <b id="verifyToggleLbl" data-i18n="verifyToggle"></b>
          <small data-i18n="verifyHint"></small>
        </div>
        <label class="switch"><input type="checkbox" id="verifyRequired" aria-labelledby="verifyToggleLbl"><span></span></label>
      </div>
      <button class="go" id="matchBtn" type="button" data-i18n="send"></button>
      <div class="pair hidden" id="pairBox"></div>
      <div class="result hidden" id="result"></div>
    </div>

    <div class="card">
      <h2 data-i18n="recent"></h2>
      <div id="recent"></div>
    </div>
  </div>
</div>

<script>
const I18N = {
  en: {
    admin: 'admin', logout: 'Log out', login: 'Admin login', password: 'Password', enter: 'Enter',
    users: 'Users', females: 'Women', males: 'Men', matches: 'Intros sent',
    send: 'Pick a random pair', sending: 'Sending…', picking: 'Picking…',
    proposed: 'Proposed introduction', ageGap: 'Age gap', years: 'years', year: 'year', sameCity: 'Same city', yes: 'yes', no: 'no',
    gW: 'Woman', gM: 'Man', confirmSend: 'Send email to both', pickAgain: 'Pick again', recent: 'Recent introductions',
    verifyToggle: 'Email confirmation', verifyHint: 'New users must confirm their email by link. If off, users are accepted immediately and no confirmation email is sent (mistyped or fake addresses can then receive introductions).',
    cityToggle: 'City field', cityHint: 'Show the city question on the signup form and prefer people from the same city.',
    e_settings_unavailable: 'Could not save the setting. Did you run migration.sql on the database?',
    none: 'No introductions yet.', sentTo: 'Introduction sent to:', age: 'age',
    e_unauthorized: 'Wrong password.',
    e_no_pair_available: 'No eligible pair left (need users of opposite gender who have not been introduced yet).',
    e_email_not_configured: 'Email is not configured (RESEND_API_KEY / FROM_EMAIL).',
    e_email_failed: 'The email provider rejected the request.',
    e_pair_invalid: 'This pair is no longer valid (a user changed or was removed). Pick again.',
    e_already_matched: 'These two were already introduced. Pick again.',
    e_invalid_request: 'Invalid request.',
    resetRejected: 'No other pair is left. The list of rejected pairs was reset: press the button to start over.',
    e_generic: 'Something went wrong.', langBtn: 'فارسی'
  },
  fa: {
    admin: 'مدیریت', logout: 'خروج', login: 'ورود مدیر', password: 'رمز عبور', enter: 'ورود',
    users: 'کاربران', females: 'زن', males: 'مرد', matches: 'آشنایی‌های ارسال‌شده',
    send: 'انتخاب یک جفت تصادفی', sending: 'در حال ارسال…', picking: 'در حال انتخاب…',
    proposed: 'آشنایی پیشنهادی', ageGap: 'اختلاف سن', years: 'سال', year: 'سال', sameCity: 'همشهری', yes: 'بله', no: 'خیر',
    gW: 'زن', gM: 'مرد', confirmSend: 'ارسال ایمیل برای هر دو', pickAgain: 'انتخاب دوباره', recent: 'آشنایی‌های اخیر',
    verifyToggle: 'تأیید ایمیل', verifyHint: 'کاربر جدید باید ایمیلش را با لینک تأیید کند. اگر خاموش باشد، کاربران بلافاصله پذیرفته می‌شوند و ایمیل تأیید فرستاده نمی‌شود (ایمیل‌های اشتباه یا جعلی هم ممکن است ایمیل آشنایی بگیرند).',
    cityToggle: 'فیلد شهر', cityHint: 'سؤال شهر در فرم ثبت‌نام نمایش داده شود و همشهری‌ها در انتخاب اولویت داشته باشند.',
    e_settings_unavailable: 'ذخیره‌ی تنظیم ممکن نشد. آیا فایل migration.sql را روی دیتابیس اجرا کرده‌ای؟',
    none: 'هنوز آشنایی‌ای ارسال نشده.', sentTo: 'ایمیل آشنایی ارسال شد به:', age: 'سن',
    e_unauthorized: 'رمز عبور اشتباه است.',
    e_no_pair_available: 'جفت مناسبی باقی نمانده (به کاربران غیرهمجنسی نیاز است که قبلاً با هم آشنا نشده‌اند).',
    e_email_not_configured: 'ارسال ایمیل تنظیم نشده است (RESEND_API_KEY / FROM_EMAIL).',
    e_email_failed: 'سرویس ایمیل درخواست را رد کرد.',
    e_pair_invalid: 'این جفت دیگر معتبر نیست (اطلاعات یکی از کاربران تغییر کرده یا حذف شده). دوباره انتخاب کن.',
    e_already_matched: 'این دو نفر قبلاً با هم آشنا شده‌اند. دوباره انتخاب کن.',
    e_invalid_request: 'درخواست نامعتبر است.',
    resetRejected: 'جفت دیگری باقی نمانده. فهرست جفت‌های ردشده پاک شد: برای شروع دوباره دکمه را بزن.',
    e_generic: 'مشکلی پیش آمد.', langBtn: 'English'
  }
};
let lang = 'en';
try { lang = localStorage.getItem('rc_lang') || 'en'; } catch (e) {}
const $ = (id) => document.getElementById(id);
const t = (k) => I18N[lang][k];

let rejected = [];   // pair keys the admin rejected during this visit
let current = null;  // the pair currently proposed

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $('langBtn').textContent = t('langBtn');
  try { localStorage.setItem('rc_lang', lang); } catch (e) {}
  if (current) renderPair(current);
  if (token) loadStats();
}
$('langBtn').addEventListener('click', () => { lang = lang === 'en' ? 'fa' : 'en'; applyLang(); });

let token = '';
try { token = sessionStorage.getItem('rc_admin') || ''; } catch (e) {}

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' } });
  const data = await res.json().catch(() => ({}));
  return { res, data };
}
const errText = (code) => t('e_' + code) || t('e_generic');

function showPanel(on) {
  $('loginCard').classList.toggle('hidden', on);
  $('panel').classList.toggle('hidden', !on);
  $('logout').classList.toggle('hidden', !on);
}

async function loadStats() {
  const { res, data } = await api('/api/admin/stats');
  if (res.status === 401) { logout(); return false; }
  if (!data.ok) return false;
  $('sTotal').textContent = data.counts.total;
  $('sF').textContent = data.counts.females;
  $('sM').textContent = data.counts.males;
  $('sMatches').textContent = data.counts.matches;
  $('cityEnabled').checked = data.city_enabled !== false;
  $('verifyRequired').checked = data.verify_required !== false;

  const box = $('recent');
  box.textContent = '';
  if (!data.recent.length) {
    const p = document.createElement('div'); p.className = 'empty'; p.textContent = t('none'); box.appendChild(p);
    return true;
  }
  const table = document.createElement('table');
  for (const r of data.recent) {
    const tr = document.createElement('tr');
    const who = (e, a, c) => e + ' (' + a + (c ? ', ' + c : '') + ')';
    for (const txt of [who(r.email_a, r.age_a, r.city_a), who(r.email_b, r.age_b, r.city_b), r.created_at]) {
      const td = document.createElement('td'); td.textContent = txt; td.className = 'em'; tr.appendChild(td);
    }
    table.appendChild(tr);
  }
  box.appendChild(table);
  return true;
}

function logout() {
  token = ''; current = null; $('pairBox').classList.add('hidden');
  try { sessionStorage.removeItem('rc_admin'); } catch (e) {}
  showPanel(false);
}
$('logout').addEventListener('click', logout);

$('loginBtn').addEventListener('click', async () => {
  token = $('pw').value;
  $('loginErr').classList.add('hidden');
  const { res } = await api('/api/admin/stats');
  if (res.ok) {
    try { sessionStorage.setItem('rc_admin', token); } catch (e) {}
    showPanel(true);
    loadStats();
  } else {
    token = '';
    $('loginErr').textContent = errText('unauthorized');
    $('loginErr').classList.remove('hidden');
  }
});
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

// Saves one on/off switch; puts it back if the server refuses.
function bindToggle(id, key) {
  $(id).addEventListener('change', async (e) => {
    const box = e.target, want = box.checked, out = $('result');
    box.disabled = true;
    try {
      const { data } = await api('/api/admin/settings', { method: 'POST', body: JSON.stringify({ [key]: want }) });
      if (!data.ok) {
        box.checked = !want;
        out.className = 'result err';
        out.textContent = errText(data.error || 'generic');
      }
    } catch (err) {
      box.checked = !want;
    } finally {
      box.disabled = false;
    }
  });
}
bindToggle('cityEnabled', 'city_enabled');
bindToggle('verifyRequired', 'verify_required');

function showMsg(kind, text) {
  const out = $('result');
  out.className = 'result ' + kind;
  out.textContent = text;
}

function renderPair(p) {
  const box = $('pairBox');
  box.textContent = '';
  box.classList.remove('hidden');
  const h = document.createElement('h3'); h.textContent = t('proposed'); box.appendChild(h);

  p.pair.forEach((u) => {
    const row = document.createElement('div'); row.className = 'who';
    const e = document.createElement('span'); e.className = 'em'; e.textContent = u.email;
    const d = document.createElement('span');
    d.textContent = [t(u.gender === 'female' ? 'gW' : 'gM'), t('age') + ' ' + u.age, u.city].filter(Boolean).join(' · ');
    row.append(e, d);
    box.appendChild(row);
  });

  const meta = document.createElement('div'); meta.className = 'meta';
  let line = t('ageGap') + ': ' + p.age_gap + ' ' + t(p.age_gap === 1 ? 'year' : 'years');
  if (p.same_city !== null) line += ' · ' + t('sameCity') + ': ' + t(p.same_city ? 'yes' : 'no');
  meta.textContent = line;
  box.appendChild(meta);

  const btns = document.createElement('div'); btns.className = 'btns';
  const send = document.createElement('button'); send.type = 'button'; send.className = 'btn-send'; send.id = 'confirmBtn';
  send.textContent = t('confirmSend'); send.addEventListener('click', confirmSend);
  const again = document.createElement('button'); again.type = 'button'; again.className = 'btn-again'; again.id = 'againBtn';
  again.textContent = t('pickAgain'); again.addEventListener('click', pickAgain);
  btns.append(send, again);
  box.appendChild(btns);
}

function setBusy(on) {
  ['matchBtn', 'confirmBtn', 'againBtn'].forEach((id) => { const el = $(id); if (el) el.disabled = on; });
}

// Step 1: draw a proposal (nothing is sent).
async function pick() {
  setBusy(true);
  $('result').className = 'result hidden';
  try {
    const { data } = await api('/api/admin/preview', { method: 'POST', body: JSON.stringify({ exclude: rejected }) });
    if (data.ok) {
      current = data;
      renderPair(data);
    } else {
      current = null;
      $('pairBox').classList.add('hidden');
      if (data.error === 'no_pair_available' && rejected.length) {
        rejected = [];
        showMsg('err', t('resetRejected'));
      } else {
        showMsg('err', errText(data.error || 'generic'));
      }
    }
  } catch (e) {
    showMsg('err', t('e_generic'));
  } finally {
    setBusy(false);
  }
}

// "Pick again": remember this pair as rejected, then draw a different one.
function pickAgain() {
  if (current) rejected.push(current.key);
  pick();
}

// Step 2: the admin approved the pair, now the email really goes out.
async function confirmSend() {
  if (!current) return;
  const p = current;
  setBusy(true);
  $('confirmBtn').textContent = t('sending');
  try {
    const { data } = await api('/api/admin/match', { method: 'POST', body: JSON.stringify({ a: p.pair[0].id, b: p.pair[1].id }) });
    if (data.ok) {
      current = null;
      $('pairBox').classList.add('hidden');
      const out = $('result');
      out.className = 'result ok';
      out.textContent = t('sentTo') + ' ';
      data.pair.forEach((u, i) => {
        if (i) out.appendChild(document.createTextNode(' ↔ '));
        const s = document.createElement('span'); s.className = 'em';
        s.textContent = u.email + ' (' + t('age') + ' ' + u.age + (u.city ? ', ' + u.city : '') + ')';
        out.appendChild(s);
      });
      loadStats();
    } else {
      showMsg('err', errText(data.error || 'generic'));
      if (data.error === 'pair_invalid' || data.error === 'already_matched') {
        current = null;
        $('pairBox').classList.add('hidden');
      } else if ($('confirmBtn')) {
        $('confirmBtn').textContent = t('confirmSend');
      }
    }
  } catch (e) {
    showMsg('err', t('e_generic'));
    if ($('confirmBtn')) $('confirmBtn').textContent = t('confirmSend');
  } finally {
    setBusy(false);
  }
}

$('matchBtn').addEventListener('click', pick);

applyLang();
if (token) { loadStats().then(ok => { if (ok) showPanel(true); }); }
</script>
</body>
</html>
